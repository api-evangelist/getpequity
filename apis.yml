aid: getpequity
name: Pequity
description: >-
  Pequity is a compensation management software platform that helps HR,
  compensation, and finance teams plan pay cycles, manage pay ranges, benchmark
  salaries, run approval workflows, and share employee compensation portals. It
  combines the familiarity of a spreadsheet with automation at scale, and syncs
  compensation data through integrations with HRIS and applicant tracking
  systems such as Workday, BambooHR, SuccessFactors, Greenhouse, Lever, and
  Ashby. Pequity maintains SOC 2 Type 2 and GDPR compliance. It was surfaced as
  a portfolio company of Norwest Venture Partners. No public developer API is
  currently published; this profile captures the company's identity, security
  posture, and trust surface.
